function renderCase(){let facts={'boy':'男孩：10岁，身高110 cm。需要结合生长曲线和生长速度评估。','family':'父亲175 cm，母亲163 cm；哥哥13岁168 cm，姐姐12岁160 cm。','sleep':'男孩经常23:00后入睡。睡眠是值得询问的线索，但不能由此认定GH缺乏。'};frame(`<div class="task"><b>任务：</b>先观察家庭图片，点击人物或线索收集信息，再选择最值得进一步了解的激素。</div><div class="layout"><section class="stage"><div class="family"><img src="family.png" alt="统一风格的家庭身高比较场景插画"><div><h3>为什么他比家人矮？</h3><p class="small">点击线索，像临床侦探一样收集证据。</p><div class="clues">${[['boy','👦 男孩'],['family','👨‍👩‍👧‍👦 家庭'],['sleep','🌙 作息']].map(([k,n])=>`<button class="chip ${caseClues.has(k)?'active':''}" data-clue="${k}">${n}${caseClues.has(k)?' ✓':''}</button>`).join('')}</div></div></div><div class="info" id="clueInfo">${caseClues.size?Array.from(caseClues).map(k=>`<div>• ${facts[k]}</div>`).join(''):'点击上方线索，逐步解锁病例信息。'}</div></section><aside class="side"><h3>🔎 选择探索方向</h3><p>为了探索生长异常与激素的关系，你最想了解哪项信息？</p><div class="options">${[['thyroid','甲状腺激素水平'],['gh','生长激素分泌情况'],['insulin','胰岛素分泌情况'],['cortisol','糖皮质激素分泌情况']].map(([v,t],i)=>`<button class="option ${caseChoice===v?'selected':''}" data-case="${v}">${'ABCD'[i]}. ${t}</button>`).join('')}</div><div class="actions"><button class="primary" id="caseSubmit" ${caseClues.size<2||!caseChoice?'disabled':''}>提交检查方向</button></div>${caseFeedback?`<div class="feedback ${caseChoice==='gh'?'':'warn'}">${caseFeedback}</div>`:''}</aside></div>${completed[0]?`<div class="report"><b>🏥 模拟医院检查资料（教学设定）</b><div>24小时GH分泌监测：脉冲幅度偏低，提示GH分泌可能不足。</div><div>IGF-1：低于相应年龄、性别及发育阶段参考范围。</div><div class="small" style="color:#5b7794">GH呈脉冲式分泌；监测结果不能单独确诊GH缺乏症。下关进入模拟调控实验。</div></div>`:''}`);document.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{caseClues.add(b.dataset.clue);renderCase()});document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{caseChoice=b.dataset.case;caseFeedback='';renderCase()});$('#caseSubmit').onclick=()=>{if(caseChoice==='gh'){caseFeedback='选择合理！解锁GH分泌监测资料。';renderCase();finish()}else{caseFeedback='这项激素也可能与生长或代谢有关，但请优先寻找直接与身高生长相关的激素。';renderCase()}}}

function renderSim(){frame(`<div class="task"><b>任务：</b>模拟患儿GH分泌偏低。请选择操作，让GH分泌活动增强。</div><div class="layout"><section class="stage"><div class="anatomy"><div><img src="hypothalamus.png" alt="下丘脑—腺垂体解剖与GHRH、SST调节示意图"><div class="small" style="text-align:center">下丘脑 → 腺垂体 → GH</div></div><div>${curve(simMode)}</div></div><div class="info">${simMode==='ghrh'?'🟢 GHRH信号增强：GH分泌活动增强。':simMode==='sst'?'🔴 SST信号增强：GH分泌活动受到抑制。':'观察基础状态的GH脉冲式分泌曲线。'}</div></section><aside class="side"><h3>🧪 GH分泌控制台</h3><p>你有两种调节信号可以操作。观察曲线，再决定如何让GH分泌增加。</p><div class="actions"><button class="sim-btn ${simMode==='ghrh'?'on':''}" data-sim="ghrh">增加GHRH</button><button class="sim-btn ${simMode==='sst'?'on':''}" data-sim="sst">增加SST</button></div>${simMode==='sst'?'<div class="feedback warn">GH反而受到抑制。试试另一种调节信号。</div>':''}${simCorrect?'<div class="feedback">✓ GHRH促进GH分泌，SST抑制GH分泌。</div>':''}<div class="note">本关为计算机模拟，不代表对患儿直接给药或治疗。</div></aside></div>`);document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{simMode=b.dataset.sim;if(simMode==='ghrh')simCorrect=true;renderSim();if(simCorrect)finish()})}

function renderEffects(){let selecting=chosenEffects.size<4,cur=effects[effectIdx];frame(`<div class="task"><b>任务：</b>先从六个领域中找出GH的<b>四项主要生理作用</b>，再预测GH增加时各指标的变化方向。</div>${selecting?`<div class="cards">${allEffects.map(e=>`<button class="effect ${chosenEffects.has(e.id)?'selected':''} ${effectWrongId===e.id?'shake':''}" data-effect="${e.id}"><span class="emoji">${e.icon}</span><b>${e.name}</b>${chosenEffects.has(e.id)?'<span class="small">✓ 已选</span>':''}</button>`).join('')}</div><div class="actions"><button class="primary" id="effectSubmit" ${chosenEffects.size!==4?'disabled':''}>验证四项作用</button><button class="secondary" id="effectClear">重新选择</button></div><p class="counter">已选择 ${chosenEffects.size}/4 项</p>${effectHint?`<div class="effect-hint" role="status" aria-live="polite">${effectHint}</div>`:''}<div class="note">提示：请辨认GH在本课程中重点学习的四项生理作用，并非判断它是否可能间接影响其他生理活动。</div>`:`<div class="layout"><section class="stage"><h3>🔬 实验 ${effectIdx+1}/4 · ${cur.name}</h3><div class="result-visual">${cur.img?`<img src="${cur.img}" alt="${cur.name}教学插画">`:`<span style="font-size:80px">${cur.icon}</span>`}<span class="bigarrow">${effectDone.has(cur.id)?'↑':'?'}</span></div><div class="info">${effectDone.has(cur.id)?cur.explain:'先预测方向，再观察实验结果。'}</div><div class="small">${effectIdx===0?'骨骼纵向生长属于长期效应，不表示瞬间长高。':'所有结果均为生理学定性示意。'}</div></section><aside class="side"><h3>预测变化方向</h3><p>当GH水平升高时，<b>${cur.label}</b>如何变化？</p><div class="options"><button class="option ${effectChoice==='up'?'selected':''}" data-dir="up">⬆ 升高 / 增强</button><button class="option ${effectChoice==='down'?'selected':''}" data-dir="down">⬇ 降低 / 减弱</button></div><div class="actions"><button class="primary" id="directionSubmit" ${!effectChoice?'disabled':''}>验证实验结果</button></div>${effectDone.has(cur.id)?`<div class="feedback">✓ 预测正确！${cur.explain}</div><div class="actions"><button class="primary" id="effectNext">${effectIdx===3?'完成四项实验':'探索下一项 →'}</button></div>`:''}<p class="counter">已验证 ${effectDone.size}/4 项</p></aside></div>`}`);if(selecting){document.querySelectorAll('[data-effect]').forEach(b=>b.onclick=()=>{let id=b.dataset.effect;if(!effects.some(e=>e.id===id)){effectWrongCount++;effectWrongId=id;effectHint=effectWrongCount===1?'再想想！':'请查阅学习资料后再练习';renderEffects();return}effectWrongId='';effectHint='';if(chosenEffects.has(id))chosenEffects.delete(id);else if(chosenEffects.size<4)chosenEffects.add(id);renderEffects()});$('#effectClear').onclick=()=>{chosenEffects.clear();effectHint='';effectWrongId='';renderEffects()};$('#effectSubmit').onclick=()=>{if(effects.every(e=>chosenEffects.has(e.id))){effectIdx=0;renderEffects()}else{alert('其中有些选项不是本关要求的GH四项主要作用。请重新观察并选择。');chosenEffects.clear();renderEffects()}}}else{document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(!effectDone.has(cur.id)){effectChoice=b.dataset.dir;renderEffects()}});$('#directionSubmit').onclick=()=>{if(effectChoice==='up'){effectDone.add(cur.id);renderEffects()}else{effectChoice='';alert('预测与GH的典型生理作用不符，请再试一次。');renderEffects()}};let nextBtn=$('#effectNext');if(nextBtn)nextBtn.onclick=()=>{if(effectIdx<3){effectIdx++;effectChoice='';renderEffects()}else finish()}}}

function renderLab(){frame(`<div class="task"><b>任务一：</b>回到10岁、身高110 cm的男孩。你会立即给他使用GH吗？<br><b>任务二：</b>了解GH制剂的生物制造，按正确顺序完成科研流程。</div>${!therapyDone?`<div class="layout"><section class="stage"><div class="family"><img src="family.png" alt="最初的儿童生长病例"><div><h3>回到临床</h3><p>患儿身高110 cm，模拟GH监测提示可能分泌不足。</p><div class="info">是否应该立即开始GH治疗？</div></div></div></section><aside class="side"><h3>🩺 治疗原则</h3><div class="options">${[['now','身高明显偏矮，立即使用GH'],['assess','明确病因，符合适应证后规范治疗'],['sleep','只要调整睡眠，就无需进一步评估']].map(([v,t],i)=>`<button class="option ${therapyChoice===v?'selected':''}" data-therapy="${v}">${'ABC'[i]}. ${t}</button>`).join('')}</div><div class="actions"><button class="primary" id="therapySubmit" ${!therapyChoice?'disabled':''}>提交临床决策</button></div></aside></div>`:`<div class="layout"><section class="stage"><h3>🧬 重组人GH科研实验室</h3><div class="labline"><img class="vial" src="gh_vial.png" alt="重组人GH药瓶插画"><div><b>临床GH制剂需要严格质量控制</b><p class="small">生物技术可以利用大肠杆菌表达重组人GH。请按正确顺序选择生产环节。</p></div></div><div class="info"><b>已完成 ${orderIdx}/5 步</b><br>${stages.slice(0,orderIdx).map((s,i)=>`${i+1}. ${s.icon} ${s.text}`).join('<br>')||'请从右侧选择第一个科研步骤。'}</div><div class="small">研究背景：GH治疗费用可能给家庭带来负担；生物制造不等于简单、廉价或无需监管的药品生产。</div></section><aside class="side"><h3>🧩 生产流程排序</h3><p>点击你认为的<b>下一步</b>，逐步完成流程。</p><div class="order">${shuffled.map(s=>`<button data-order="${s.id}" ${stages.slice(0,orderIdx).some(x=>x.id===s.id)?'disabled':''}>${s.icon} ${s.text} ${stages.slice(0,orderIdx).some(x=>x.id===s.id)?' ✓':''}</button>`).join('')}</div>${orderError?'<div class="feedback warn">顺序还不正确。想想这一环节需要哪些前置条件。</div>':''}<div class="note">大肠杆菌表达GH不代表一定分泌至培养液。实际工艺可能涉及胞内表达、复性、纯化及内毒素、生物活性等质量控制。</div></aside></div>`}`);if(!therapyDone){document.querySelectorAll('[data-therapy]').forEach(b=>b.onclick=()=>{therapyChoice=b.dataset.therapy;renderLab()});$('#therapySubmit').onclick=()=>{if(therapyChoice==='assess'){therapyDone=true;renderLab()}else{alert('仅凭身高或GH监测线索不能决定治疗。应进一步明确病因及适应证。');therapyChoice='';renderLab()}}}else{document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(b.dataset.order===stages[orderIdx].id){orderIdx++;orderError=false;renderLab();if(orderIdx===5)finish()}else{orderError=true;renderLab()}})}}
